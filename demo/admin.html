<body>

<main><header class="topbar"><span>我的班级 / 学生档案</span><span class="demo-badge">演示模式</span></header><section class="content"><div class="heading"><div><p class="eyebrow">新学期 · 新的相识</p><h1>慢慢认识，每一个你。</h1><p class="muted">把学生的来处、热爱和闪光点，收进一本小档案。</p></div><button id="export" class="button">导出示例名单 ↓</button></div>
<div class="collection"><div><span class="live-dot"></span><strong>学生填写入口</strong><p id="connection">正在读取手机访问地址…</p></div><button id="copy" class="button solid" disabled>复制填写链接</button></div>
<div class="stats"><div><span>示例学生</span><strong>6 <small>位</small></strong></div><div><span>资料完整</span><strong>4 <small>位</small></strong></div><div><span>待补充</span><strong>2 <small>位</small></strong></div><div class="stat-progress"><span>示例完成率</span><strong>67<small>%</small></strong><div class="track"><i></i></div></div></div>
<section class="roster"><div class="roster-heading"><div><h2>学生档案</h2><p>以下为虚构示例，手机填写内容暂不同步到这里。</p></div><label class="search"><span>搜索</span><input id="search" placeholder="姓名、学号或籍贯" aria-label="搜索学生"></label></div><div class="filters" role="group" aria-label="档案状态"><button class="selected" data-filter="all">全部学生</button><button data-filter="complete">资料完整</button><button data-filter="pending">待补充</button><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>学生</th><th>籍贯</th><th>喜欢的科目</th><th>闪光点</th><th>资料状态</th><th><span class="sr-only">操作</span></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" hidden>没有找到符合条件的学生，试试其他关键词。</div><footer class="table-footer">每个名字背后，都有一个值得了解的故事。<span>示例班级 · 2026 秋季</span></footer></section><p class="footnote">资料留在身边，了解多一点。</p></section></main>
